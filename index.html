<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MochEpoch</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #252a25; background: #f3f1e9; }
      body { max-width: 48rem; margin: 0 auto; padding: 2rem 1rem; }
      h1 { margin-bottom: 0.5rem; }
      #description { font-size: 1.25rem; }
      #characters { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 1rem; }
      article { padding: 1.25rem; background: #fffef9; border: 1px solid #cacbc0; border-radius: 0.5rem; }
      h2 { margin-top: 0; }
      article p:last-child { margin-bottom: 0; }
      #status[role="alert"] { color: #90291d; }
    </style>
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main>
      <h1>MochEpoch</h1>
      <p id="status" role="status">Loading world…</p>
      <section id="world" aria-label="Current world" hidden>
        <p id="description"></p>
        <div id="characters"></div>
      </section>
    </main>
  </body>
</html>
